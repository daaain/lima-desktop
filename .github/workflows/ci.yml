# CI: the full check suite, a headless run of the real app, and the backend against real Lima VMs.
# Linux is a real target, so it is tested here. ubuntu-26.04 is pinned by name: it ships podman 5.7
# (24.04's podman 4.9 would trip the app's podman >= 5 check), and `ubuntu-latest` moves.
# Actions are pinned to commit SHAs (a tag can be moved; a public repo's CI shouldn't follow it).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.97.1
  NODE_VERSION: 24.15.0
  PNPM_VERSION: 10.33.4
  LIMA_VERSION: 2.3.0
  CARGO_TERM_COLOR: always
  # Tauri 2's Linux build dependencies (https://v2.tauri.app/start/prerequisites/#linux), and just.
  TAURI_DEPS: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
    libssl-dev build-essential file just

jobs:
  check:
    name: check + headless app
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $TAURI_DEPS xvfb xauth dbus-x11 imagemagick

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -c clippy,rustfmt
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The crate embeds the built frontend (tauri.conf.json frontendDist), so it must exist first.
      - run: pnpm build
      - run: just check

      # The real app under Xvfb + WebKitGTK, replaying the committed (anonymised) snapshot.
      - name: Headless app on the fixture
        run: just replay-headless src-tauri/tests/fixtures/snapshot-1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: headless-screenshot
          path: .snapshots/screens/*.png
          if-no-files-found: ignore

  e2e:
    name: e2e on real Lima (QEMU)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Let the runner user use KVM
        run: |
          if [ ! -e /dev/kvm ]; then echo "::error::this runner has no /dev/kvm"; exit 1; fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle   # the trigger applies the rule asynchronously
          ls -l /dev/kvm
          test -w /dev/kvm

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $TAURI_DEPS qemu-system-x86 qemu-utils ovmf

      - name: Lima ${{ env.LIMA_VERSION }} (checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/lima-vm/lima/releases/download/v$LIMA_VERSION"
          tarball="lima-$LIMA_VERSION-Linux-x86_64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/SHA256SUMS" | grep " $tarball\$" | sha256sum -c -
          sudo tar -C /usr/local -xzf "$tarball"
          limactl --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lima
          key: lima-images-${{ env.LIMA_VERSION }}-${{ hashFiles('src-tauri/tests/e2e/*.yaml') }}
          restore-keys: lima-images-${{ env.LIMA_VERSION }}-

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - run: just e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-log
          path: .e2e/*.log
          if-no-files-found: ignore
