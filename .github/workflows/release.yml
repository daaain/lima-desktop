# Release builds: on a version tag (v0.1.0, matching the version in tauri.conf.json, Cargo.toml and
# package.json), the macOS app (universal: Apple silicon and Intel) as a .dmg and the Linux app as a
# .deb and an AppImage, attached to a DRAFT GitHub Release to read over and publish by hand.
# Run by hand on any branch (Actions → Release → Run workflow, or `gh workflow run release.yml --ref
# <branch>`), it's a dry run of all of that: the same checks and builds, the files kept as the run's
# artifacts, and the release it would draft shown in the run's summary, releasing nothing.
#
# Unsigned: the macOS app is only ad-hoc signed (as every arm64 binary must be), so a downloaded copy
# is quarantined and macOS refuses it until the quarantine is removed (the release notes and the
# README say how). Signing and notarising need an Apple Developer ID; Tauri's bundler does both
# when the APPLE_* variables are set (https://v2.tauri.app/distribute/sign/macos/).
# No Rust cache: a cache saved by a run on a tag can only be read by runs on that same tag, and every
# release is a new tag, so packing and uploading one at the end of each job bought nothing.
# Actions are pinned to commit SHAs, as in ci.yml.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never half-publish a release

env:
  RUST_VERSION: 1.97.1
  NODE_VERSION: 24.15.0
  PNPM_VERSION: 10.33.4
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: the version agrees everywhere
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # On a tag, the tag's version; on a dry run, whatever tauri.conf.json says.
      - name: tauri.conf.json, Cargo.toml and package.json all say the same version
        id: check
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then want="${GITHUB_REF_NAME#v}"
          else want=$(node -p 'require("./src-tauri/tauri.conf.json").version'); fi
          sh tools/check-release-version.sh HEAD "$want"
          echo "version=$want" >> "$GITHUB_OUTPUT"

  # One runner compiles both arches (aarch64, then x86_64) and bundles the universal app. Splitting
  # them across runners built faster, but each macOS job waits for a runner of its own, and those
  # waits (5 and 10 minutes in the dry run of 12 November 2026) cost more than the split saved.
  macos:
    name: macOS (universal .dmg)
    needs: version
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust ${{ env.RUST_VERSION }}, both Mac targets
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -t aarch64-apple-darwin,x86_64-apple-darwin
          rustup default "$RUST_VERSION"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg
      - name: What was built
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Lima Desktop.app"
          lipo -info "$app/Contents/MacOS/lima-desktop"
          codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier' || true
          ls -l src-tauri/target/universal-apple-darwin/release/bundle/dmg/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux:
    name: Linux (.deb, AppImage)
    needs: version
    # The oldest Ubuntu with Tauri's WebKitGTK 4.1, not CI's 26.04: a binary runs on systems with
    # the glibc it was built against or newer, so building on 24.04 reaches more of them.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev build-essential file

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build --bundles deb,appimage
      - run: ls -l src-tauri/target/release/bundle/deb/ src-tauri/target/release/bundle/appimage/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: draft the GitHub Release
    needs: [version, macos, linux]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write   # to create the release and attach the files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{macos,linux}'
          path: dist
          merge-multiple: true
      # Only a pushed v* tag releases; anything run by hand is a dry run, even on a tag.
      - name: Draft v${{ needs.version.outputs.version }}${{ github.event_name != 'push' && ' (dry run)' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The files, wherever they landed: an artifact with more than one path (Linux's .deb and
          # .AppImage) keeps their folders under its common parent, so dist/* would hand gh two
          # directories, which it can't upload.
          mapfile -t files < <(find dist -type f | sort)
          printf '%s\n' "${files[@]}"
          [ "${#files[@]}" -eq 3 ] || { echo "::error::expected a .dmg, a .deb and an .AppImage"; exit 1; }
          cat > notes.md <<'EOF'
          ## Install

          **macOS** (13 or newer, Apple silicon or Intel): open the `.dmg` and drag Lima Desktop to
          Applications. This build isn't signed with an Apple Developer ID yet, so macOS quarantines
          the download and says the app "is damaged" or "can't be checked". Remove the quarantine once:

          ```bash
          xattr -dr com.apple.quarantine "/Applications/Lima Desktop.app"
          ```

          (A `.dmg` fetched with `curl -LO` isn't quarantined in the first place.) It needs Lima 2
          (`limactl`) installed.

          **Linux** (x86_64): `sudo apt install ./Lima.Desktop_*_amd64.deb`, or make the `.AppImage`
          executable and run it. Needs WebKitGTK 4.1 (Ubuntu 22.04+, Debian 12+, Fedora 39+).

          EOF
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            # The changelog --generate-notes would add: from the latest release up to this commit. A
            # tag that exists already would be described as it is, not this commit, so then the notes
            # are for a name no tag has.
            tag="v$VERSION" taken=""
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              taken=1 tag="v$VERSION-dry-run-$GITHUB_RUN_ID"
            fi
            changes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" --jq .body)
            {
              echo "# Dry run: Lima Desktop $VERSION, from $GITHUB_REF_NAME"
              if [ -n "$taken" ]; then
                echo "\`v$VERSION\` is tagged already: bump the version (\`just release patch\`) before releasing this."
                echo
              fi
              echo "A run on the tag \`v$VERSION\` would draft this release with these files:"
              echo
              for f in "${files[@]}"; do echo "- \`${f##*/}\` ($(du -h "$f" | cut -f1))"; done
              echo
              echo "---"
              cat notes.md
              echo "$changes"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Dry run: nothing released. The draft it would make is in the run's summary."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Lima Desktop $VERSION" \
            --notes-file notes.md --generate-notes
