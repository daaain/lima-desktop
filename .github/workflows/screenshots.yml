# The README's screenshots, redrawn from the UI's browser tests on fake data (e2e-ui/) and published
# to GitHub Pages (https://daaain.github.io/lima-desktop/), where the README and docs/design/ui.md
# link to them: nothing is committed. After every merge to main that touches the UI; by hand for
# any branch (Actions → Screenshots → Run workflow), which only main publishes — another branch's
# are the run's `screenshots` artifact.
# Needs, once: Settings → Pages → Source: GitHub Actions.
# Actions are pinned to commit SHAs, as in ci.yml.
name: Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e-ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.15.0
  PNPM_VERSION: 10.33.4

jobs:
  draw:
    name: draw the screenshots
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build
      - name: Browser tests, screenshots into site/
        run: LD_SCREENSHOT_DIR=site node --test e2e-ui/ui.test.mjs
      - name: A page to look at them on
        run: node e2e-ui/gallery.mjs site "$GITHUB_SHA"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: site/

  publish:
    name: publish them to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: draw
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write      # to deploy
      id-token: write   # to prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
