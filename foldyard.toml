# foldyard config — lima-desktop
# Generated by `foldyard init`. This starts as a LOCKED-DOWN, stack-less dev box you can
# safely build and poke — then you GROW it by uncommenting, in this order:
#   1. `fy box up` then `fy box shell` — a rootless Lima VM with ONLY this repo mounted, no
#      push credential, and a firewall whose one way out is the allowlisting proxy on your
#      computer. `fy verify` proves the isolation. The first `fy box up` starts the
#      allowlist LEARNING for an hour: setup isn't refused, every host it would have refused
#      is recorded, and then it ENFORCES by itself. `fy allow learn` grants what it saw in
#      one reviewed batch ([proxy] below).
#   2. The agent below is ALREADY declared (`fy init --with`), so the first `fy box up`
#      installs it, offers its install hosts and asks once (hidden) for its credential.
#      Then turn its switch on and start it — an AI agent INSIDE the safe sandbox. Use it
#      to work out the rest of this config with you:
#          fy mode claude=on && fy claude
#   3. Uncomment a stack + the features at the bottom as the project needs them. Box
#      settings are create-time too: adopt, then `fy box down && fy box up`.
# Resolution everywhere: explicit env var wins → foldyard.local.toml (gitignored,
# per-developer overrides) → this file → built-in default. Keep what's PERSONAL out of
# here: which agent subscription you pay for, how big your VM is, a pinned worktree port.
# Those go in each developer's own copy of foldyard.local.toml.example (written beside this
# file), which can also switch a block below OFF for one person with `disabled = true`.

[project]
name = "lima-desktop"
# Container/volume/network name prefix (a worktree appends `-<name>`).
prefix = "lima-desktop"
# The foldyard this file was written for, as a FLOOR — `fy` REFUSES to run in this
# checkout below it. Not fussiness: an older fy doesn't fail on config it doesn't
# understand, it ignores those keys silently and does the old thing. Raise this in the
# same commit as any setting that needs a newer fy, and the two can never come apart.
min_foldyard_version = "0.8.0"
# recommended_foldyard_version = "0.8.0"   # a NUDGE, never a block: printed on
#                     # `fy up` / `fy box up` / `fy host restart` when you're behind it. Raise it
#                     # for a version worth having; leave the floor for one you must have.
# A compose stack to drive alongside the box — uncomment when you have one (step 3), add
# its host ports under [ports] below and its service names to [proxy] no_proxy, and
# extend [claude].system_prompt with the stack paragraph parked beside it (an agent that
# knows the box but not the stack is half-lost).
#   app = "app"                # the app service (fy shell target)
#   app_port = "WEB_PORT"      # [ports] key shown in the TUI + opened by `fy open`
#   compose = ["compose.yml"]  # compose files in -f order, relative to this dir
#   worktree_init = "scripts/worktree-init.sh"  # copies gitignored files (.env…) into
#                              # each new worktree; runs in a container, never on your computer
# Why this repo wanted each foldyard it adopted. Both version messages list the entries
# between the fy you have and the one you're being pointed at, so an upgrade prompt says
# what you'd GAIN. A sub-table, so it must stay last in [project]:
# [project.foldyard_version_reasons]
# "0.8.0" = "the version this project started on"

[machine]
# A rootless VM that mounts ONLY this repo. Default here is the Lima backend + the VM
# firewall: fail-closed, so the box's only way out is the allowlisting proxy on your
# computer (below). Sizing applies at FIRST creation; to resize later:
# `foldyard machine recreate`.
#   backend = "podman"    # the single shared podman machine — no concurrent per-project
#                         # VMs, and no VM firewall
#   firewall = false      # lima without the VM firewall: the box uses the proxy, but
#                         # nothing stops a process that ignores it (cooperative only)
#   host_firewall = true  # Linux: enforce the same firewall on your computer too
#                         # (nftables; you install it once — `fy machine host-firewall`
#                         # prints the steps). Only if every developer is on Linux: fy
#                         # refuses to start where it can't (macOS, stock WSL2)
#   runtime = "gvisor"    # (experimental) the box (and what it creates) under gVisor's
#                         # userspace kernel: a kernel-exploit layer; ~1.2x on a test
#                         # suite; edits from your computer need dev-server polling
backend = "lima"
firewall = true
name = "lima-desktop"
cpus = 4
memory_mib = 8192   # MiB — any whole number
disk_gib = 60

# Egress proxy. Declaring [proxy] routes the box's egress through the proxy on your
# computer — REQUIRED by the VM firewall (which otherwise leaves the box with no way out).
# It decrypts and logs every request (the `passthrough` hosts aside).
# `enforce = "learn"` starts the allowlist OBSERVING on the first `fy box up`/`fy up` for
# an hour — nothing refused, every host it would refuse recorded — then ENFORCING, by
# itself (it can't be left open by mistake):
#     fy allow learn                        # review what it recorded, grant it in one go
#     fy allow enforce learn --for 30m      # learn again, e.g. for a new dependency
#     fy allow enforce on                   # enforce now
# (`enforce = true` enforces from the first run instead; the recommendations below
# are then how the box still builds — you're offered them before the first build.)
# Grants are deliberately NOT config: they live in the allow-store on your computer,
# outside the repo mount, so the box can't widen its own allowlist by editing a file it
# can write. Blocked hosts show live in `fy tui`, where one keypress grants them (and the
# allowlist pane under its Network Log manages grants + these offers). `enforce` here only
# sets the FIRST answer — `fy allow enforce` is the switch from then on. Any keyless host
# (below) is ALWAYS allowed implicitly — never list it.
[proxy]
enforce = "learn"
# The repo can RECOMMEND hosts (this is how a team SHARES its allowlist): each entry is
# OFFERED per host at `fy up`/`fy box up`/`fy allow sync`, and nothing is granted without
# that yes — repo config asks, you answer. (`fy allow sync --yes` takes them all at
# once, for an unattended setup with no terminal to answer on.) These cover box bootstrap,
# so an enforcing allowlist comes up working after one round of consented yeses; the agents
# below add their own install hosts to the same offer when you uncomment one. Add your
# project's own hosts WITH a why (`fy allow learn` prints ready-made lines for these).
recommend = [
  { host = "pypi.org", why = "uv/pip — box bootstrap + deps" },
  { host = "files.pythonhosted.org", why = "uv/pip package downloads" },
  { host = "github.com", why = "git fetch/clone + release-asset redirects" },
  { host = "objects.githubusercontent.com", why = "GitHub release assets — uv-managed Python" },
  { host = "release-assets.githubusercontent.com", why = "GitHub release assets (newer host)" },
  { host = "deb.debian.org", why = "apt — the [box].packages layer's system packages" },
  { host = "registry-1.docker.io", why = "box image build — base image manifest/blobs" },
  { host = "auth.docker.io", why = "box image build — Docker Hub auth token" },
  { host = "production.cloudfront.docker.com", why = "box image build — Docker Hub blob CDN" },
  { host = "production.cloudflare.docker.com", why = "box image build — Docker Hub's other blob CDN" },
  { host = "ghcr.io", why = "box image build — the uv binary image layer" },
  { host = "pkg-containers.githubusercontent.com", why = "box image build — ghcr.io blob storage" },
  { host = "registry.npmjs.org", why = "pnpm install + the box image's pnpm" },
  { host = "static.rust-lang.org", why = "rustup — clippy/rustfmt for the box image" },
  { host = "index.crates.io", why = "cargo — the crates.io sparse index" },
  { host = "static.crates.io", why = "cargo — crate downloads" },
  # Playwright's Chromium, baked into the box image (box.Dockerfile) for `just ui-e2e`: only the
  # build fetches it. To install it in a running box instead, grant just the path there:
  # `fy allow add storage.googleapis.com/chrome-for-testing-public/` (recommend takes hosts only).
  { host = "cdn.playwright.dev", when = "build", why = "box image build — Playwright's browser downloads (redirects to the next)" },
  { host = "storage.googleapis.com", when = "build", why = "box image build — Chrome for Testing, where cdn.playwright.dev redirects" },
]
# passthrough = ["@jvm", "@linux"]   # the default: tunnelled UN-decrypted (Java, apt);
#                                    # the rest is decrypted. ["@all"] = every bundle
# no_proxy = ["{project}-db", "redis"]  # step 3: your stack's service names, reached
#                                    # directly — through the proxy they hang, then 502

# ── Agents (step 2) ──────────────────────────────────────────────────────────────────────
# Claude Code (`fy claude`). Declaring [claude] installs it on box-up + mounts its persisted
# login/transcripts. Keyless: the real token is injected at the proxy on your computer, NEVER
# in the box (`fy box up` prompts once, hidden; stored only on your computer). Then
# `fy mode claude=on`.
# system_prompt is appended via --append-system-prompt, so a fresh `fy claude` starts
# oriented instead of re-deriving the box and getting it wrong. The one below WORKS as
# written for a BOX-ONLY project — uncomment and go. It says nothing about a stack, so it
# stays true at step 2; when you add compose at step 3, paste the follow-on paragraph
# below it. Same progressive opt-in as the rest of this file.
[claude]
keyless = "oauth"      # Bearer on api.anthropic.com ← `claude setup-token` on your computer
# keyless = "api-key"  # x-api-key on api.anthropic.com ← from console.anthropic.com
# (on your own, keyless is fine here; on a team, put it in foldyard.local.toml — which
#  subscription you pay for is personal, and a shared one prompts every colleague)
system_prompt = """
You are root in this project's foldyard dev box, started by `fy claude` with permission
prompts skipped. Orientation, so you don't have to re-derive it:

The isolation is REAL but this is not a locked-down shell. `DOCKER_HOST`/`CONTAINER_HOST` are
preset and you have FULL engine access through them — `docker`/`podman` run/exec/build,
compose, the lot. What bounds you is the machine underneath: a ROOTLESS VM that mounts
ONLY this repo, with a VM firewall whose sole way out is the allowlisting proxy on the
user's computer. So the blast radius is this repo plus this project's containers — never
that computer. Prove it any time with `fy verify` (expect ALL PASS).

`fy` works in here for the read and box verbs: `fy verify`, `fy box shell|ps|down`, and
`fy mode` to SEE the credential mode — the mode is SET on the user's computer, not in
here, and so are egress grants. A second checkout beside this one is `fy worktree add <name>`,
then `WORKTREE=<name> fy <verb>`.

Git: read and commit locally, but you CANNOT push — no credential in here reaches the
origin, by design. The user pushes from their computer.

Egress that fails is the allowlist doing its job, not a bug to route around. Report the
blocked hostname and ask the user to `fy allow add <hostname>`; the grant store
lives outside this box, out of your reach.

You may not be alone: several sessions can attach to this one box and checkout. You run
as root, so files you create land root-owned.

Depth on demand, both version-matched to the foldyard running here — never a web search
or a clone of the project, which would describe a different version: the `foldyard`
SKILL in .claude/skills/ (the model — modes, egress, why a change didn't take), and
`fy docs` for the manual (`fy docs` lists topics; `fy docs modes`, `fy docs adr-0007`).

This project is Lima Desktop: a Tauri 2 app (Rust in src-tauri/, SvelteKit + Svelte 5 in src/)
for Lima VMs and the podman containers in them. docs/development.md is the map. The box is
Linux, with its own node_modules and src-tauri/target (volumes, not the user's Mac copies).
`just --list` shows the recipes; `just check` is svelte-check, vitest, the tools' tests, cargo
test and clippy. There is no Lima in here and no access to the user's VMs, by design: real data
arrives as snapshots the user records on their Mac (`just snapshot`) into .snapshots/ — real
VM and container names, so treat them as theirs — and `just replay-headless` runs the real app
on one under Xvfb and screenshots it into .snapshots/screens/. Anonymised snapshots are the
committed fixtures in src-tauri/tests/fixtures/. /var/run/docker.sock is this VM's rootless
podman (libpod API included), but it is the REAL engine running this box: only the read-only
live test is safe against it
(`LD_PODMAN_SOCKET=/var/run/docker.sock cargo test --test podman_live lists_images_and_volumes`).
"""
#
# …and WHEN YOU ADD A COMPOSE STACK (step 3), append this paragraph to that prompt — it is
# the half that only makes sense once there is a stack to drive:
# #
# # This project also drives a compose stack. `fy up | ps | logs [svc] | shell | down`
# # runs it, and the engine you reach IS that running stack — a stray `rm -f` or `down`
# # acts on it for real, including on another session's work. Reach its services by
# # CONTAINER NAME, not localhost: you sit on the project network, and published ports
# # are published to the user's computer, not to you.
#
#
# Session config for the same CLI, merged over the box's own settings — the non-prompt half
# of the same idea. Any key Claude's settings.json takes; `fy claude --settings` still wins.
# [claude.settings]
# showThinkingSummaries = true
#
# OpenAI Codex CLI (`fy codex`). Declaring [codex] installs it on box-up + mounts ~/.codex.
# Native installer (a static binary — no node needed). Keyless like Claude: the proxy
# injects on your computer. Leave `keyless` out for an in-box `codex login --api-key` (the
# ChatGPT browser login can't complete in the box). On a team, `keyless` goes in
# foldyard.local.toml, as for [claude].
# [codex]
# keyless = "api-key"    # Authorization: Bearer ← OPENAI_API_KEY (captured to host.env)
# # keyless = "chatgpt"  # ChatGPT subscription: a token service refreshes ~/.codex/auth.json
# system_prompt = """…"""   # same key + same job as [claude]'s above (paste that one);
#                          # Codex takes it as a developer instruction, not a system prompt
#
# Codex's config.toml keys, one `-c` per leaf (nested tables flatten to dotted paths):
# [codex.config]
# model_reasoning_summary = "auto"
# tui = { raw_output_mode = false }

# ── GitHub — uncomment as you need it (step 3) ───────────────────────────────────────────
# Two switches, both off until you turn one on; `fy docs github-app` sets up the App.
# `github` is a GitHub App installation token minted on your computer — the App's
# permissions on github.com are its scope. `github-user` is YOUR OWN `gh` token, an
# emergency switch: `fy mode github-user=on ttl=30m`, and it switches itself off. Both
# inject on api.github.com only: `git push` stays refused, but through the API the token
# can do whatever it holds — the App's installation permissions (`fy config widenings`
# shows what it was last read to grant), or ALL of yours for `github-user`, writes
# included. The box holds a dummy GH_TOKEN for the proxy to replace; the packaged box
# has no `gh`, so add `packages = ["gh"]` under [box]. A new row takes
# `fy box down && fy box up`.
# [[inject]]
# switch = "github"                 # the App's PEM → host.env FY_INJECT_GITHUB (prompted)
# kind = "github-app"
# app_id = "123456"
# installation_id = "7654321"
# box_env = { GH_TOKEN = "x" }
#
# [[inject]]
# switch = "github-user"
# kind = "gh-cli"
# emergency = true
# box_env = { GH_TOKEN = "x" }

# ── The rest — uncomment as you grow (step 3) ────────────────────────────────────────────
# Ports published on your computer, keyed by the env var your compose file reads.
# In-container ports never move, so a second worktree's stack gets offset ports on your
# computer and never collides.
# [ports]
# APP_PORT = 3000
#
# Your OWN toolchain image instead of foldyard's packaged generic box (engine client + git
# + uv). Point it at a Dockerfile; foldyard injects the socket/CLI/proxy-CA at box-up.
#
# STOP THE BOX AND YOUR COMPUTER CLOBBERING EACH OTHER'S DEPS — the one thing every
# project hits. The box mounts this checkout, so an in-tree build-artifact dir (.venv,
# node_modules, target, .next) is the SAME directory your computer builds into: two
# toolchains, two kernels, two uids, one dir. `shadow_volumes` masks each one with a
# per-box named volume — the box gets its own copy at that path, your computer keeps its
# own underneath, neither sees the other. It needs the two keys under it, not just itself:
# a fresh shadow volume starts EMPTY (so `warmup` fills it), and it is a DIFFERENT
# filesystem from the package cache (so the default hardlink import fails cross-device —
# pin `env`). `warmup` installs must be FROZEN/locked: the lockfiles live on the mount,
# and a resolving install would rewrite your computer's tree as root. `caches` is
# optional — a warm cache that survives box recreation; pnpm ALSO needs its store pinned
# there (npm_config_store_dir), or it relocates the store inside the node_modules volume
# and re-downloads every time.
[box]
# Rust + Node/pnpm + Tauri's Linux build deps + Xvfb: box.Dockerfile says what and why.
image = { dockerfile = "box.Dockerfile", tag = "lima-desktop-box:latest" }
# The Mac builds into these same dirs (macOS binaries, its own node_modules): the box gets its own.
# Not build/: the static frontend is the same on both sides, and SvelteKit deletes and recreates
# that dir, which it can't do to a mount point.
shadow_volumes = ["node_modules", "src-tauri/target", ".svelte-kit"]
# Frozen installs only — the lockfiles live on the mount. cargo fetch fills the registry cache so
# the first build in a fresh box only compiles.
warmup = [
  { dir = ".", run = "pnpm install --frozen-lockfile" },
  { dir = "src-tauri", run = "cargo fetch --locked" },
]
caches = [
  { volume = "lima-desktop-pnpm-store", path = ".local/share/pnpm/store" },   # path is under HOME
  { volume = "lima-desktop-cargo-home", path = ".cargo" },
]
# (a sub-table, so it stays last in [box]; packages/[[box.tools]] below would go above it)
[box.env]
# pnpm: the store is a different volume (so filesystem) from node_modules — copy, don't hardlink
npm_config_store_dir = "~/.local/share/pnpm/store"
npm_config_package_import_method = "copy"
# cargo's registry + git checkouts in the cache volume; the toolchain stays in the image (rustup)
CARGO_HOME = "~/.cargo"
# WebKitGTK under Xvfb: no GPU buffers, no accessibility bus to look for
WEBKIT_DISABLE_DMABUF_RENDERER = "1"
NO_AT_BRIDGE = "1"
# The browser tests' Chromium, baked into the image there (box.Dockerfile)
PLAYWRIGHT_BROWSERS_PATH = "/opt/ms-playwright"
#
# System packages, baked once into a cached layer on the box image (any package manager):
# packages = ["postgresql-client", "just"]
#
# Other tools, installed once per fresh box as MONITORED steps (reported ✓/✗):
# [[box.tools]]
# name = "pulumi"
# install = "curl -fsSL https://get.pulumi.com | sh -s -- --install-root /opt/fy-tools --no-edit-path"
#
# VS Code attach (`fy code`) — persist the vscode-server volume across box recreations.
# Extensions install on attach (config, not .vscode/extensions.json — the list decides
# what YOUR COMPUTER installs, so it is read from the adopted copy); settings are applied to
# the box's server.
[vscode]
extensions = ["anthropic.claude-code"]
[vscode.settings]
"remote.autoForwardPorts" = false
