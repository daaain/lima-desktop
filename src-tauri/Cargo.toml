[package]
name = "lima-desktop"
version = "0.1.0"
description = "A desktop app for Lima VMs and the podman containers in them"
authors = ["Daniel Demmel"]
license = "Apache-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lima_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
zstd = "0.14.3"
thiserror = "2.0.21"
log = "0.4.35"
env_logger = "0.11.11"
sysinfo = "0.40.1"
tauri-plugin-window-state = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# The snapshot recorder's unit tests run with `cargo test`.
[[example]]
name = "snapshot"
test = true

# The end-to-end runner against a real Lima (`just e2e`); its pure parts' tests run with `cargo test`.
[[example]]
name = "e2e"
test = true
