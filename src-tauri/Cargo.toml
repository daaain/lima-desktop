[package]
name = "lima-desktop"
version = "0.5.0"
description = "A desktop app for Lima VMs and the podman containers in them"
authors = ["Daniel Demmel"]
license = "Apache-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lima_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
zstd = "0.14.3"
thiserror = "2.0.21"
libc = "0.2.191"
log = "0.4.35"
env_logger = "0.11.11"
sysinfo = "0.40.1"
tauri-plugin-window-state = "2"
# Comparing GitHub's latest release with this app's version (`updates.rs`); Tauri's own version type.
semver = "1.0.28"
# Asking GitHub once a day whether a newer version is out (`updates.rs`). Nothing in the tree speaks
# TLS on macOS or Linux (Tauri's reqwest is only for iOS and Android): ureq is small and blocking,
# and rustls with ring and Mozilla's roots needs nothing from the system to build or run.
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

# On macOS: the menu bar's items are drawn whole, their text included, in the system font
# (CoreText), past three quarters their names in the menu bar's own colour (AppKit says which); the
# disk's free space is read as Finder counts it (Foundation, `host_use.rs`); a warning item's image
# for while it's highlighted is given to AppKit as a PNG, as Tauri gives it the item's own image. All
# already in the tree through Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSActionCell", "NSAppearance", "NSButton", "NSButtonCell", "NSCell", "NSControl", "NSImage", "NSResponder", "NSStatusBarButton", "NSStatusItem", "NSView"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFAttributedString", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-graphics", "CTFont", "CTFontDescriptor", "CTFontTraits", "CTLine", "CTStringAttributes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSGeometry", "NSString", "NSURL", "NSValue", "NSError"] }
png = "0.18.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# The snapshot recorder's unit tests run with `cargo test`.
[[example]]
name = "snapshot"
test = true

# The end-to-end runner against a real Lima (`just e2e`); its pure parts' tests run with `cargo test`.
[[example]]
name = "e2e"
test = true
