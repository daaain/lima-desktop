# Lima Desktop's e2e (`just e2e`): Debian 12, whose podman is 4.3, rootless, its API socket
# forwarded the way Lima's own `template:podman` does — so the e2e can check that the app shows
# this VM but refuses its containers. Works with vz (macOS) and QEMU (Linux) alike.

minimumLimaVersion: 2.0.0

base:
- template:_images/debian-12

containerd:
  system: false
  user: false

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    command -v podman >/dev/null 2>&1 && exit 0
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y --no-install-recommends podman uidmap slirp4netns dbus-user-session catatonit
- mode: user
  script: |
    #!/bin/bash
    set -eux -o pipefail
    systemctl --user enable --now podman.socket

probes:
- script: |
    #!/bin/bash
    set -eux -o pipefail
    if ! timeout 30s bash -c "until command -v podman >/dev/null 2>&1; do sleep 3; done"; then
      echo >&2 "podman is not installed yet"
      exit 1
    fi
  hint: See "/var/log/cloud-init-output.log" in the guest

portForwards:
- guestSocket: "/run/user/{{.UID}}/podman/podman.sock"
  hostSocket: "{{.Dir}}/sock/podman.sock"
