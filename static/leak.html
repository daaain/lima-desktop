<!doctype html>
<!-- Temporary leak-isolation page (not for committing). Reads its mode from /leak-mode.json. -->
<meta charset="utf-8">
<title>leak test</title>
<body style="font: 14px system-ui; padding: 2rem">
<h1 id="mode">…</h1>
<p id="stats"></p>
<script>
  (async () => {
    const { mode, hz = 10 } = await (await fetch('/leak-mode.json', { cache: 'no-store' })).json();
    document.getElementById('mode').textContent = `${mode} @ ${hz} Hz`;
    if (mode === 'app') return location.replace('/');
    if (mode === 'idle') return;
    const invoke = window.__TAURI_INTERNALS__.invoke;
    let calls = 0, bytes = 0, errors = 0;
    setInterval(async () => {
      try {
        const r = await invoke(mode);
        calls++;
        bytes = JSON.stringify(r).length;
      } catch (e) {
        errors++;
      }
    }, 1000 / hz);
    setInterval(() => {
      document.getElementById('stats').textContent = `${calls} calls, ${errors} errors, last payload ${bytes} bytes`;
    }, 1000);
  })();
</script>
